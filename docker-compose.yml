services:
  frontend-dev:
    container_name: harms-frontend-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
    environment:
      - NODE_ENV=development
    networks:
      - harms-network
    stdin_open: true
    tty: true

  frontend-prod:
    container_name: harms-frontend-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
    networks:
      - harms-network
    profiles:
      - production

networks:
  harms-network:
    driver: bridge
